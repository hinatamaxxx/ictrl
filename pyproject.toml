[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "utsushite"
version = "0.1.0"
description = "Control an iPhone from Windows over USB or Wi-Fi, from a GUI or from AI agents (MCP)."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Install with setup.ps1, which uses requirements.txt (exact versions,
# --no-deps): pymobiledevice3's own dependency list pulls in IPython, PyAV,
# FastAPI and other tools utsushite does not use. These are the direct ones.
dependencies = [
    "starlette",
    "uvicorn",
    "wsproto",
    "Pillow",
    "pillow-heif",
    "pywin32; sys_platform == 'win32'",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Globalization; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
]

[project.scripts]
utsushite = "utsushite.__main__:main"

[tool.setuptools.packages.find]
include = ["utsushite*"]

[tool.setuptools.package-data]
utsushite = ["ui/*"]
